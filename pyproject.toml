[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-workhouse"
version = "0.1.0"
description = "An autonomous, emotional, hierarchical company of AI agents whose job is to make money by doing what other AI agents would not think to do."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.6", "pydantic>=2.7", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["workhouse*"]

[tool.setuptools.package-data]
"workhouse.dashboard" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
